name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: locarion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, mbstring, bcmath, gd, zip, intl
      - name: Copy .env
        run: cp .env.example .env
      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Generate key
        run: php artisan key:generate
      - name: Run Pint
        run: ./vendor/bin/pint --test
      - name: Run Tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: locarion_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      # - name: Test
      #   run: pnpm -r test
      - name: Build
        run: pnpm -r build

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build -t locarion-app:ci -f docker/app/Dockerfile .
      - name: Build nginx image
        run: docker build -t locarion-nginx:ci -f docker/nginx/Dockerfile .
